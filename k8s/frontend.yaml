apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 520646131385.dkr.ecr.ap-southeast-2.amazonaws.com/ecommerce/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5173
        env:
        - name: VITE_PRODUCT_API_URL
          value: http://a566e527101d34e1abcabfb5ad682582-263976215.ap-southeast-2.elb.amazonaws.com
        - name: VITE_REVIEW_API_URL
          value: http://ac0baad498e82419985a3c95cfcf7e0e-1013665987.ap-southeast-2.elb.amazonaws.com
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  # type: NodePort
  ports:
  - port: 80
    targetPort: 5173
  # - port: 3000
  #   targetPort: 5173
  #   nodePort: 30000
  selector:
    app: frontend

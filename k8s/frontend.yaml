apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 520646131385.dkr.ecr.ap-southeast-2.amazonaws.com/ecommerce/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5173
        env:
        - name: VITE_PRODUCT_API_URL
          value: http://a0688343553ef4d69981eceb0aec1304-1470566101.ap-southeast-2.elb.amazonaws.com
        - name: VITE_REVIEW_API_URL
          value: http://ac45a2d05a2d840c29181b43f4f11667-1929074266.ap-southeast-2.elb.amazonaws.com
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  # type: NodePort
  ports:
  - port: 80
    targetPort: 5173
  # - port: 3000
  #   targetPort: 5173
  #   nodePort: 30000
  selector:
    app: frontend

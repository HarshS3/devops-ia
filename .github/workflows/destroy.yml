name: Destroy Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - destroy

env:
  AWS_REGION: ap-southeast-2

jobs:
  destroy-all:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[destroy]') || github.ref == 'refs/heads/destroy'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Connect to EKS & Clean Up Kubernetes Resources (ELBs & PVCs)
        run: |
          echo "Attempting to connect to EKS cluster..."
          if aws eks describe-cluster --name ecommerce-cluster --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
            echo "EKS cluster is reachable. Updating kubeconfig..."
            aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ecommerce-cluster
            
            echo "Deleting all Kubernetes services to remove LoadBalancers (ELBs)..."
            kubectl delete svc --all --all-namespaces --timeout=120s || true
            
            echo "Deleting all deployments and pods..."
            kubectl delete deployment --all --all-namespaces --timeout=120s || true
            
            echo "Deleting PVCs to unbind EBS volumes..."
            kubectl delete pvc --all --all-namespaces --timeout=120s || true
            
            echo "Waiting 45 seconds for AWS ELBs and ENIs to deprovision..."
            sleep 45
          else
            echo "EKS cluster does not exist or is already deleted. Proceeding to Terraform destroy."
          fi

      - name: Clean Up Orphaned Classic Load Balancers
        run: |
          echo "Checking for any lingering Load Balancers..."
          ELBS=$(aws elb describe-load-balancers --region ${{ env.AWS_REGION }} --query "LoadBalancerDescriptions[].LoadBalancerName" --output text 2>/dev/null || true)
          for elb in $ELBS; do
            if [ -n "$elb" ]; then
              echo "Deleting ELB: $elb"
              aws elb delete-load-balancer --load-balancer-name "$elb" --region ${{ env.AWS_REGION }} || true
            fi
          done

      - name: Terraform Destroy
        run: |
          cd terraform
          terraform init
          terraform destroy -auto-approve

      - name: Comprehensive Cost Audit & Deep Cleanup
        run: |
          echo "=== AUDIT & PURGE OF ANY LINGERING AWS RESOURCES in ${{ env.AWS_REGION }} ==="
          
          echo "--- 1. Checking Classic Load Balancers ---"
          ELBS=$(aws elb describe-load-balancers --region ${{ env.AWS_REGION }} --query "LoadBalancerDescriptions[].LoadBalancerName" --output text 2>/dev/null || true)
          for elb in $ELBS; do
            if [ -n "$elb" ]; then
              echo "Purging lingering ELB: $elb"
              aws elb delete-load-balancer --load-balancer-name "$elb" --region ${{ env.AWS_REGION }} || true
            fi
          done

          echo "--- 2. Checking V2 Load Balancers (ALB/NLB) ---"
          V2_ARNS=$(aws elbv2 describe-load-balancers --region ${{ env.AWS_REGION }} --query "LoadBalancers[].LoadBalancerArn" --output text 2>/dev/null || true)
          for arn in $V2_ARNS; do
            if [ -n "$arn" ]; then
              echo "Purging lingering V2 Load Balancer: $arn"
              aws elbv2 delete-load-balancer --load-balancer-arn "$arn" --region ${{ env.AWS_REGION }} || true
            fi
          done

          echo "--- 3. Checking & Purging Unattached EBS Volumes ---"
          VOLUMES=$(aws ec2 describe-volumes --region ${{ env.AWS_REGION }} --filters "Name=status,Values=available" --query "Volumes[].VolumeId" --output text 2>/dev/null || true)
          for vol in $VOLUMES; do
            if [ -n "$vol" ]; then
              echo "Purging unattached EBS Volume: $vol"
              aws ec2 delete-volume --volume-id "$vol" --region ${{ env.AWS_REGION }} || true
            fi
          done

          echo "--- 4. Checking & Releasing Unallocated Elastic IPs ---"
          EIPS=$(aws ec2 describe-addresses --region ${{ env.AWS_REGION }} --query "Addresses[?AssociationId==null].AllocationId" --output text 2>/dev/null || true)
          for eip in $EIPS; do
            if [ -n "$eip" ]; then
              echo "Releasing unused Elastic IP: $eip"
              aws ec2 release-address --allocation-id "$eip" --region ${{ env.AWS_REGION }} || true
            fi
          done

          echo "=== FINAL ZERO-BILLABLE-RESOURCES AUDIT ==="
          echo "--- Running/Pending EC2 Instances ---"
          aws ec2 describe-instances --region ${{ env.AWS_REGION }} \
            --filters "Name=instance-state-name,Values=running,pending" \
            --query "Reservations[].Instances[].{ID:InstanceId,Type:InstanceType,State:State.Name}" \
            --output table

          echo "--- Available/Pending NAT Gateways ---"
          aws ec2 describe-nat-gateways --region ${{ env.AWS_REGION }} \
            --filter "Name=state,Values=available,pending" \
            --query "NatGateways[].{ID:NatGatewayId,State:State}" \
            --output table

          echo "--- EKS Clusters ---"
          aws eks list-clusters --region ${{ env.AWS_REGION }} --output table

          echo "--- Active Elastic Load Balancers ---"
          aws elb describe-load-balancers --region ${{ env.AWS_REGION }} \
            --query "LoadBalancerDescriptions[].LoadBalancerName" \
            --output table

          echo "--- Lingering EBS Volumes ---"
          aws ec2 describe-volumes --region ${{ env.AWS_REGION }} \
            --filters "Name=status,Values=available,in-use" \
            --query "Volumes[].{ID:VolumeId,Size:Size,State:State}" \
            --output table

          echo "Audit complete. Zero active billable resources verified."
